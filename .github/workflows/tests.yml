name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the test suite (no dependencies to install)
        run: npm test
      - name: dist/FinancialTracker.gs is what src/ builds
        run: npm run bundle:check
      - name: The whole suite again, against the single file people paste
        run: npm run test:bundle
